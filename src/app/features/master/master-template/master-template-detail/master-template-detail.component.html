<div class="container py-3">
  <div class="page-header d-flex justify-content-between align-items-center flex-wrap gap-2 mb-3">
    <div>
      <div class="page-title">Template Detail</div>
      <div class="page-subtitle">Edit template fields. JSON is read-only.</div>
    </div>
    <button type="button" class="btn btn-outline-secondary btn-sm" (click)="goBack()">Back</button>
  </div>

  @if (errorMessage) {
  <div class="alert alert-danger py-2">{{ errorMessage }}</div>
  }

  @if (message) {
  <div class="alert alert-success py-2">{{ message }}</div>
  }

  <div class="card border-0 shadow-sm">
    <div class="card-body">
      @if (loading) {
      <div class="text-muted">Loading detail...</div>
      } @else {
      <form #templateForm="ngForm" (ngSubmit)="save(templateForm)">
        <div class="row g-3">
          <div class="col-12">
            <label class="form-label">Name <span class="text-danger">*</span></label>
            <input class="form-control" name="name" [(ngModel)]="formModel.name" required />
          </div>

          <div class="col-12">
            <label class="form-label">Description</label>
            <input class="form-control" name="description" [(ngModel)]="formModel.description" />
          </div>

          <div class="col-12">
            <label class="form-label">Version <span class="text-danger">*</span></label>
            <input class="form-control" name="version" [(ngModel)]="formModel.version" required />
          </div>

          <div class="col-12">
            <label class="form-label">Row data template (Json's format)</label>
            <pre class="json-preview">{{ formattedJson }}</pre>
            <small class="text-danger">* This is a read-only field. You cannot edit the row data template.</small>
          </div>
        </div>

        <div class="d-flex justify-content-end gap-2 mt-3">
          <button type="button" class="btn btn-outline-secondary" (click)="goBack()">Cancel</button>
          <button type="submit" class="btn btn-primary" [disabled]="templateForm.invalid || saving">
            {{ saving ? 'Saving...' : 'Save' }}
          </button>
        </div>
      </form>
      }
    </div>
  </div>
</div>
